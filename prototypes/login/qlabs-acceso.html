<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q Labs — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#6C5CE7;--brand-2:#8B7CF6;--brand-soft:rgba(108,92,231,.10);
    --paper:#F4F3F9;--card:#FFFFFF;--ink:#0B0B12;--ink-2:#3A3A45;--ink-3:#70707C;
    --line:rgba(11,11,18,.09);--radius:18px;--ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .mono{font-family:'JetBrains Mono',monospace}
  ::selection{background:var(--brand);color:#fff}

  .topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:-.01em}
  .brand__mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--brand-2),var(--brand));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 6px 16px -4px rgba(108,92,231,.55)}
  .back{font-size:14px;color:var(--ink-3);display:inline-flex;align-items:center;gap:7px;transition:color .2s}
  .back:hover{color:var(--ink)}

  .stage{flex:1;display:grid;place-items:center;padding:20px}
  .panel{width:100%;max-width:520px;animation:rise .5s var(--ease)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .hidden{display:none}

  h1{font-size:clamp(30px,4vw,40px);font-weight:800;letter-spacing:-.02em;text-align:center}
  .sub{text-align:center;color:var(--ink-2);margin:12px auto 34px;max-width:36ch;font-size:16px}

  /* ROLE CARDS */
  .role{display:flex;align-items:center;gap:18px;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;
    transition:transform .16s var(--ease),border-color .16s,box-shadow .2s;margin-bottom:16px}
  .role:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 18px 40px -24px rgba(108,92,231,.5)}
  .role__ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
  .role--creator .role__ic{background:linear-gradient(145deg,#FDE1D2,#FBC9AE);color:#C2410C}
  .role--biz .role__ic{background:linear-gradient(145deg,#E4DEFB,#C9BEF6);color:var(--brand)}
  .role__t{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .role__d{font-size:14px;color:var(--ink-3);margin-top:3px}
  .role__arrow{margin-left:auto;color:var(--ink-3);transition:transform .2s,color .2s}
  .role:hover .role__arrow{transform:translateX(4px);color:var(--brand)}

  /* LOGIN CARD */
  .auth{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:38px clamp(24px,4vw,44px);
    box-shadow:0 30px 70px -40px rgba(11,11,18,.35)}
  .auth__brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:8px}
  .role-badge{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 26px;width:fit-content;
    font-size:13px;font-weight:500;color:var(--ink-2);background:var(--brand-soft);border:1px solid rgba(108,92,231,.2);
    padding:7px 14px;border-radius:999px}
  .role-badge button{background:none;border:0;color:var(--brand);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline}
  .tabs{display:flex;background:var(--paper);border-radius:14px;padding:5px;margin-bottom:26px}
  .tabs button{flex:1;padding:12px;border:0;background:none;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink-3);border-radius:10px;cursor:pointer;transition:.2s}
  .tabs button.on{background:var(--ink);color:#fff}
  .g-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;padding:15px;border:1px solid var(--line);
    background:var(--card);border-radius:13px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.18s}
  .g-btn:hover{border-color:var(--ink-3);background:#fafafb}
  .divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--ink-3)}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .divider span{width:8px;height:8px;border-radius:50%;border:1px solid var(--line)}
  .field{width:100%;padding:16px 18px;border:1px solid var(--line);background:var(--paper);border-radius:13px;
    font-family:inherit;font-size:15px;color:var(--ink);margin-bottom:14px;transition:.18s}
  .field::placeholder{color:var(--ink-3)}
  .field:focus{outline:none;border-color:var(--brand);background:var(--card)}
  .submit{width:100%;padding:17px;border:0;background:var(--brand);color:#fff;border-radius:13px;
    font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px;transition:transform .16s var(--ease),box-shadow .2s;
    box-shadow:0 10px 26px -10px rgba(108,92,231,.7)}
  .submit:hover{transform:translateY(-2px)}
  .foothelp{text-align:center;font-size:13px;color:var(--ink-3);margin-top:20px}
  .proto-tag{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.08em;color:var(--ink-3);background:var(--card);border:1px solid var(--line);
    padding:7px 14px;border-radius:999px}
</style>
</head>
<body>

<div class="topbar">
  <a href="qlabs-prototipo.html" class="brand"><span class="brand__mark">Q</span>Q Labs</a>
  <a href="qlabs-prototipo.html" class="back">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Volver al sitio
  </a>
</div>

<div class="stage">

  <!-- PASO 1 · ROL -->
  <div class="panel" id="stepRole">
    <h1>¿Cómo querés entrar?</h1>
    <p class="sub">Elegí cómo vas a usar Q Labs. Podés cambiarlo antes de iniciar sesión.</p>

    <button class="role role--biz" data-role="negocio">
      <span class="role__ic">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2" stroke="currentColor" stroke-width="1.8"/></svg>
      </span>
      <span>
        <div class="role__t">Soy negocio</div>
        <div class="role__d">Activar herramientas, beneficios y campañas con creadores</div>
      </span>
      <span class="role__arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>

    <button class="role role--creator" data-role="creador">
      <span class="role__ic">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 4h13l3 4-3 4H4V4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 12v8M8 12v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <span>
        <div class="role__t">Soy creador</div>
        <div class="role__d">Ver promos de marcas, aplicar y crecer en la Academia</div>
      </span>
      <span class="role__arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
  </div>

  <!-- PASO 2 · LOGIN -->
  <div class="panel hidden" id="stepLogin">
    <div class="auth">
      <div class="auth__brand"><span class="brand__mark">Q</span>Q Labs</div>
      <div class="role-badge">
        Entrando como <b id="roleName" style="color:var(--ink)">Negocio</b>
        <button id="changeRole">Cambiar</button>
      </div>
      <div class="tabs">
        <button class="on" id="tabLogin">Iniciar sesión</button>
        <button id="tabReg">Registrarme</button>
      </div>
      <button class="g-btn" onclick="go()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.76c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0012 23z"/><path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 010-4.18V7.07H2.18a11 11 0 000 9.86l3.66-2.84z"/><path fill="#EA4335" d="M12 4.75c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.46 14.97.5 12 .5A11 11 0 002.18 7.07l3.66 2.84C6.71 7.31 9.14 4.75 12 4.75z"/></svg>
        Continuar con Google
      </button>
      <div class="divider"><span></span></div>
      <input class="field" type="email" placeholder="Email" autocomplete="email">
      <input class="field" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="submit" onclick="go()">Entrar</button>
      <p class="foothelp">Al continuar aceptás los Términos y la Política de privacidad de Q Labs.</p>
    </div>
  </div>

</div>

<div class="proto-tag">PROTOTIPO · el login es simulado</div>

<script>
  let role='negocio';
  const stepRole=document.getElementById('stepRole');
  const stepLogin=document.getElementById('stepLogin');
  const roleName=document.getElementById('roleName');

  document.querySelectorAll('.role').forEach(b=>b.addEventListener('click',()=>{
    role=b.dataset.role;
    roleName.textContent = role==='negocio' ? 'Negocio' : 'Creador';
    stepRole.classList.add('hidden');
    stepLogin.classList.remove('hidden');
  }));
  document.getElementById('changeRole').addEventListener('click',()=>{
    stepLogin.classList.add('hidden');
    stepRole.classList.remove('hidden');
  });
  document.getElementById('tabLogin').addEventListener('click',e=>{e.target.classList.add('on');document.getElementById('tabReg').classList.remove('on')});
  document.getElementById('tabReg').addEventListener('click',e=>{e.target.classList.add('on');document.getElementById('tabLogin').classList.remove('on')});

  function go(){
    window.location.href = role==='negocio' ? 'qlabs-negocio.html' : 'qlabs-creador.html';
  }
</script>
</body>
</html>
