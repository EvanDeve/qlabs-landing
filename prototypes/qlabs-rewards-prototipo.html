   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;

          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

      qrHtml += '</tbody>';
      qrHtml += '</table>';

        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +

      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;

            qrSvg += 'M' + mc + ',' + mr + rect;

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  // qrcode.stringToBytes

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  // qrcode.createStringToBytes

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --brand:#6d5ef0; --brand-ink:#4b3fd0; --brand-soft:#efedff; --brand-2:#a99bff;
    --bg:#f4f4fa; --card:#ffffff; --ink:#191a2e; --muted:#6c6d88; --line:#e8e8f1;
    --ok:#16a34a; --ok-soft:#e6f6ec; --bad:#dc2626; --bad-soft:#fcebeb; --warn:#c2410c; --warn-soft:#fdf0e6;
    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-full:999px;
    --sh:0 6px 20px -8px rgba(30,20,80,.25);
    --t:180ms ease;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#e6e6f2;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100dvh}
  /* Demo harness bar */
  .demobar{width:100%;background:#141326;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px;
    justify-content:center;flex-wrap:wrap;position:sticky;top:0;z-index:40}
  .demobar .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8f8fb5;font-weight:700}
  .roleset{display:inline-flex;background:#26243f;border-radius:var(--r-full);padding:3px}
  .roleset button{border:0;background:transparent;color:#c9c9e4;font-size:13px;font-weight:600;
    padding:7px 13px;border-radius:var(--r-full);cursor:pointer;transition:var(--t)}
  .roleset button.on{background:var(--brand);color:#fff}
  /* Phone frame */
  .phone{width:100%;max-width:430px;background:var(--bg);flex:1;display:flex;flex-direction:column;
    position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
  @media(min-width:480px){
    body{padding:0 0 24px}
    .phone{margin-top:14px;border-radius:26px;min-height:760px;max-height:860px;border:1px solid #d6d6e6}
    .demobar{border-radius:0}
  }
  /* App header */
  .apphead{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 12px;
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
  .logo{display:flex;align-items:center;gap:7px;font-weight:800;letter-spacing:-.01em}
  .logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
  .apphead .who{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.25}
  .apphead .who b{color:var(--ink);display:block;font-size:12.5px}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .pad{padding:16px 16px 24px}
  h2.title{margin:2px 0 2px;font-size:22px;letter-spacing:-.02em}
  p.sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
  .oh{display:flex;align-items:center;gap:11px;margin-bottom:9px}
  .biz-emoji{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;font-size:22px;flex-shrink:0}
  .biz-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:5px}
  .biz-cat{font-size:12px;color:var(--muted)}
  .verif{color:var(--brand);font-size:13px}
  .reward-row{display:flex;align-items:center;gap:8px;background:var(--brand-soft);border-radius:var(--r-md);
    padding:9px 11px;margin:9px 0;font-size:13.5px;font-weight:600;color:var(--brand-ink)}
  .reward-row .ic{font-size:15px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:6px 0}
  .meta b{color:var(--ink);font-weight:600}
  .terms{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.45}
  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:46px;
    border:0;border-radius:var(--r-md);font-size:14.5px;font-weight:700;cursor:pointer;transition:var(--t);padding:0 14px}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:active{background:var(--brand-ink)}
  .btn.ghost{background:var(--brand-soft);color:var(--brand-ink)}
  .btn.dark{background:#1d1c30;color:#fff}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.sm{min-height:40px;font-size:13.5px;width:auto;padding:0 15px}
  /* Badges */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:var(--r-full);letter-spacing:.01em}
  .b-ok{background:var(--ok-soft);color:var(--ok)}
  .b-bad{background:var(--bad-soft);color:var(--bad)}
  .b-warn{background:var(--warn-soft);color:var(--warn)}
  .b-mut{background:#eeeef4;color:var(--muted)}
  .b-brand{background:var(--brand-soft);color:var(--brand-ink)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .chip{font-size:11.5px;background:#f1f1f8;border:1px solid var(--line);color:#55566f;padding:5px 9px;border-radius:var(--r-full)}
  /* Coupon */
  .coupon{position:relative;overflow:hidden}
  .coupon.used,.coupon.exp{opacity:.86}
  .coupon .qrwrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 2px}
  .qrbox{background:#fff;padding:11px;border-radius:14px;border:1px solid var(--line);line-height:0}
  .qrbox img,.qrbox canvas,.qrbox svg{display:block;border-radius:4px}
  .coupon.used .qrbox,.coupon.exp .qrbox{filter:grayscale(1) opacity(.5)}
  .tok{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);letter-spacing:.06em;margin-top:9px}
  .tapnote{font-size:11.5px;color:var(--brand-ink);margin-top:6px;font-weight:600}
  .divider{height:1px;background:var(--line);margin:12px 0}
  /* bottom nav */
  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--card)}
  .tabbar button{flex:1;border:0;background:transparent;padding:9px 4px 10px;cursor:pointer;color:var(--muted);
    font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;transition:var(--t)}
  .tabbar button .i{font-size:19px;line-height:1}
  .tabbar button.on{color:var(--brand)}
  /* applicant */
  .appl{display:flex;align-items:center;gap:11px}
  .av{width:40px;height:40px;border-radius:var(--r-full);background:linear-gradient(135deg,var(--brand-2),var(--brand));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0}
  .appl .n{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:5px}
  .appl .s{font-size:12px;color:var(--muted)}
  .group-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 2px 8px}
  /* scanner */
  .scanwrap{display:flex;flex-direction:column;gap:14px}
  #reader{width:100%;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:#000}
  #reader:empty{display:none}
  .scanhint{background:var(--card);border:1px dashed var(--line);border-radius:var(--r-lg);padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
  .scanhint .big{font-size:40px;display:block;margin-bottom:8px}
  .simlist{display:flex;flex-direction:column;gap:8px}
  .simrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;cursor:pointer;transition:var(--t)}
  .simrow:active{background:var(--brand-soft)}
  .simrow .tk{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}
  .simrow .nm{font-weight:600;font-size:13.5px}
  .manual{display:flex;gap:8px}
  .manual input{flex:1;min-height:46px;border:1px solid var(--line);border-radius:var(--r-md);padding:0 13px;font-size:14px;font-family:ui-monospace,Menlo,monospace}
  .manual input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
  /* result overlay */
  .overlay{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:30px;text-align:center;color:#fff;animation:pop .25s ease}
  .overlay.show{display:flex}
  .overlay.ok{background:linear-gradient(160deg,#15a34a,#0c7a37)}
  .overlay.bad{background:linear-gradient(160deg,#dc2626,#9c1414)}
  .overlay .mark{width:96px;height:96px;border-radius:var(--r-full);background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:52px;margin-bottom:18px}
  .overlay h3{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
  .overlay p{margin:2px 0;font-size:14.5px;opacity:.95}
  .overlay .rcard{background:rgba(255,255,255,.14);border-radius:var(--r-md);padding:12px 16px;margin:16px 0 20px;font-size:14px}
  .overlay .rcard b{font-size:16px}
  .overlay .btn{background:#fff;max-width:220px}
  .overlay.ok .btn{color:#0c7a37}.overlay.bad .btn{color:#9c1414}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  /* modal QR */
  .modal{position:fixed;inset:0;z-index:80;background:rgba(15,12,35,.72);display:none;align-items:center;justify-content:center;padding:26px}
  .modal.show{display:flex}
  .modal .inner{background:#fff;border-radius:22px;padding:24px;text-align:center;max-width:320px;width:100%}
  .modal .inner h4{margin:0 0 4px;font-size:17px}
  .modal .inner .qrbox{margin:14px auto 8px;display:inline-block}
  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 16px}
  .empty .big{font-size:38px;display:block;margin-bottom:8px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#1d1c30;color:#fff;
    padding:11px 18px;border-radius:var(--r-full);font-size:13.5px;font-weight:600;opacity:0;transition:var(--t);z-index:90;pointer-events:none;box-shadow:var(--sh)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="demobar">
  <span class="lbl">Modo demo</span>
  <div class="roleset" id="roleset">
    <button data-role="creador" class="on">👤 Creador</button>
    <button data-role="negocio">🏪 Negocio</button>
    <button data-role="scanner">📷 Escáner</button>
  </div>
</div>

<div class="phone">
  <div class="apphead">
    <div class="logo"><span class="dot">Q</span> UGC·CRC <span style="color:var(--muted);font-weight:600;font-size:13px">Rewards</span></div>
    <div class="who" id="who"></div>
  </div>
  <div class="scroll" id="scroll"><div class="pad" id="view"></div></div>
  <div class="tabbar" id="tabbar"></div>
  <div class="overlay" id="overlay"></div>
</div>

<div class="modal" id="modal"><div class="inner">
  <h4 id="modalTitle"></h4>
  <div class="qrbox" id="modalQr"></div>
  <div class="tok" id="modalTok"></div>
  <div style="height:14px"></div>
  <button class="btn ghost" onclick="closeModal()">Cerrar</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ---------- MOCK DATA ---------- */
function tok(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return "QLABS-"+s;}
const DAY=86400000, now=Date.now();

const businesses={ b1:{name:"Zonna Gastrobar", emoji:"🍽️"} };
const creators={
  c1:{handle:"aas.deluca", name:"Andrés", followers:"1.3K"},
  c2:{handle:"evanmarin", name:"Evan", followers:"20K"}
};
const ME="c1"; // creador actual
const MYBIZ="b1"; // negocio actual

let offers=[
  {id:"o1", bizId:"b1", biz:"Zonna Gastrobar", emoji:"🍽️", cat:"Restaurante · Escazú", title:"Reel de la terraza", reward:"Cena degustación para 2", value:"₡45.000", days:5, terms:"Válido lun–jue. No acumulable con otras promos. Presentar QR antes de ordenar."},
  {id:"o5", bizId:"b1", biz:"Zonna Gastrobar", emoji:"🍸", cat:"Restaurante · Escazú", title:"Stories de coctelería", reward:"2 cócteles de autor", value:"₡14.000", days:7, terms:"Válido todos los días después de 5pm."},
  {id:"o2", bizId:"b2", biz:"Cafetería Los Higuerones", emoji:"☕", cat:"Cafetería · Escazú", title:"Brunch de domingo", reward:"Brunch para 2 + café", value:"₡22.000", days:10, terms:"Solo domingos, 8am–1pm."},
  {id:"o3", bizId:"b3", biz:"Dulce Chilena", emoji:"🧁", cat:"Pastelería · San José", title:"Caja de postres", reward:"Caja de 6 postres", value:"₡12.000", days:14, terms:"Retiro en local. Avisar 24h antes."},
  {id:"o4", bizId:"b4", biz:"La Arboleda", emoji:"🥗", cat:"Restaurante · Santa Ana", title:"Almuerzo saludable", reward:"2 bowls + jugo", value:"₡16.000", days:0, terms:"Válido L–V al mediodía."}
];

// applications: estado pendiente | aceptada
let applications=[
  {id:"a1", offerId:"o1", creatorId:"c1", status:"aceptada"},
  {id:"a2", offerId:"o1", creatorId:"c2", status:"aceptada"},
  {id:"a3", offerId:"o5", creatorId:"c1", status:"pendiente"},
  {id:"a4", offerId:"o2", creatorId:"c1", status:"pendiente"}
];

// coupons: estado activo | redimido | vencido
let coupons=[
  {id:"cp1", token:tok(), offerId:"o1", creatorId:"c1", status:"activo",   issuedAt:now-2*DAY, expiresAt:now+5*DAY, redeemedAt:null},
  {id:"cp2", token:tok(), offerId:"o3", creatorId:"c1", status:"redimido", issuedAt:now-9*DAY, expiresAt:now-2*DAY, redeemedAt:now-3*DAY},
  {id:"cp3", token:tok(), offerId:"o4", creatorId:"c1", status:"vencido",  issuedAt:now-20*DAY,expiresAt:now-4*DAY, redeemedAt:null}
];

/* ---------- STATE ---------- */
let state={ role:"creador", ctab:"ofertas", ntab:"aplicantes" };

const $=(s,r=document)=>r.querySelector(s);
const offer=id=>offers.find(o=>o.id===id);
const couponOf=(offerId,creatorId)=>coupons.find(c=>c.offerId===offerId&&c.creatorId===creatorId);
function isExpired(c){return c.status!=="redimido" && c.expiresAt<Date.now();}
function liveStatus(c){ if(c.status==="redimido")return "redimido"; if(c.expiresAt<Date.now())return "vencido"; return "activo"; }
function daysLeft(c){return Math.max(0,Math.round((c.expiresAt-Date.now())/DAY));}

/* ---------- RENDER ---------- */
function render(){
  const roleTitle={creador:{n:creators[ME].name,r:"Creador · @"+creators[ME].handle},
                   negocio:{n:businesses[MYBIZ].name,r:"Negocio · verificado"},
                   scanner:{n:businesses[MYBIZ].name,r:"Escáner en tienda"}};
  const rt=roleTitle[state.role];
  $("#who").innerHTML=`<b>${rt.n}</b>${rt.r}`;
  document.querySelectorAll("#roleset button").forEach(b=>b.classList.toggle("on",b.dataset.role===state.role));
  const v=$("#view");
  if(state.role==="creador") renderCreador(v);
  else if(state.role==="negocio") renderNegocio(v);
  else renderScanner(v);
  renderTabs();
  $("#scroll").scrollTop=0;
}

function renderTabs(){
  const tb=$("#tabbar");
  if(state.role==="creador"){
    tb.style.display="flex";
    tb.innerHTML=tab("ofertas","🏷️","Ofertas",state.ctab)+tab("cupones","🎟️","Mis cupones",state.ctab);
  }else if(state.role==="negocio"){
    tb.style.display="flex";
    tb.innerHTML=tab("aplicantes","👥","Aplicantes",state.ntab)+tab("bcupones","🎟️","Cupones",state.ntab);
  }else{ tb.style.display="none"; tb.innerHTML=""; }
}
function tab(key,i,label,active){return `<button class="${active===key?'on':''}" data-tab="${key}"><span class="i">${i}</span>${label}</button>`;}

/* ----- CREADOR ----- */
function renderCreador(v){
  if(state.ctab==="ofertas"){
    v.innerHTML=`<h2 class="title">Ofertas</h2><p class="sub">Marcas verificadas buscando creadores. Aplicá con tu book.</p>`+
      offers.map(o=>{
        const ap=applications.find(a=>a.offerId===o.id&&a.creatorId===ME);
        let action;
        if(!ap) action=`<button class="btn primary" data-act="apply" data-id="${o.id}">Aplicar</button>`;
        else if(ap.status==="pendiente") action=`<button class="btn ghost" disabled>Ya aplicaste · Pendiente</button>`;
        else action=`<button class="btn ghost" disabled>✓ Aceptada</button>`;
        return `<div class="card">
          <div class="oh"><div class="biz-emoji">${o.emoji}</div>
            <div><div class="biz-name">${o.biz} <span class="verif">✔</span></div><div class="biz-cat">${o.cat}</div></div></div>
          <div style="font-weight:700;font-size:15.5px;margin:2px 0 2px">${o.title}</div>
          <div class="reward-row"><span class="ic">🎁</span> Recompensa: ${o.reward}</div>
          <div class="meta"><span>Valor aprox <b>${o.value}</b></span><span>Vence en <b>${o.days} días</b></span></div>
          <p class="terms">${o.terms}</p>
          <div style="height:11px"></div>${action}
        </div>`;
      }).join("");
  }else{
    const mine=coupons.filter(c=>c.creatorId===ME);
    if(!mine.length){ v.innerHTML=cupHeader()+`<div class="empty"><span class="big">🎟️</span>Todavía no tenés cupones. Cuando un negocio te emita uno, aparece acá.</div>`; return; }
    v.innerHTML=cupHeader()+mine.map(couponCardHTML).join("");
    mine.forEach(c=>drawQR($("#qr-"+c.id), c.token, 150));
  }
}
function cupHeader(){return `<h2 class="title">Mis cupones</h2><p class="sub">Mostrá el QR en el local. El negocio lo escanea para validarlo.</p>`;}
function couponCardHTML(c){
  const o=offer(c.offerId), st=liveStatus(c);
  const badge=st==="activo"?`<span class="badge b-ok">● Activo · vence en ${daysLeft(c)}d</span>`
    : st==="redimido"?`<span class="badge b-mut">✓ Usado</span>`:`<span class="badge b-warn">Vencido</span>`;
  const cls=st==="redimido"?"used":st==="vencido"?"exp":"";
  return `<div class="card coupon ${cls}">
    <div class="oh"><div class="biz-emoji">${o.emoji}</div>
      <div style="flex:1"><div class="biz-name">${o.biz}</div><div class="biz-cat">${o.title}</div></div>${badge}</div>
    <div class="reward-row"><span class="ic">🎁</span> ${o.reward}</div>
    <div class="qrwrap">
      <div class="qrbox" id="qr-${c.id}" ${st==="activo"?`data-act="zoom" data-id="${c.id}" style="cursor:pointer"`:""}></div>
      <div class="tok">${c.token}</div>
      ${st==="activo"?`<div class="tapnote">Tocá el QR para ampliar</div>`:""}
    </div>
  </div>`;
}

/* ----- NEGOCIO ----- */
function renderNegocio(v){
  const myOffers=offers.filter(o=>o.bizId===MYBIZ);
  if(state.ntab==="aplicantes"){
    v.innerHTML=`<h2 class="title">Aplicantes</h2><p class="sub">Emití el cupón de recompensa cuando quieras aprobar a un creador.</p>`;
    myOffers.forEach(o=>{
      const apps=applications.filter(a=>a.offerId===o.id);
      if(!apps.length) return;
      v.innerHTML+=`<div class="group-label">${o.emoji} ${o.title}</div>`;
      v.innerHTML+=apps.map(a=>{
        const cr=creators[a.creatorId], cp=couponOf(o.id,a.creatorId);
        let right;
        if(cp) right=`<span class="badge b-brand">🎟️ Cupón emitido</span>`;
        else right=`<button class="btn primary sm" data-act="emit" data-app="${a.id}">Emitir cupón</button>`;
        return `<div class="card"><div class="appl">
          <div class="av">${cr.name[0]}</div>
          <div style="flex:1"><div class="n">@${cr.handle} <span class="verif">✔</span></div>
            <div class="s">${cr.name} · ${cr.followers} seguidores · <span style="color:${a.status==='aceptada'?'var(--ok)':'var(--muted)'}">${a.status}</span></div></div>
        </div><div style="height:11px"></div>${right}</div>`;
      }).join("");
    });
  }else{
    const mine=coupons.filter(c=>offer(c.offerId).bizId===MYBIZ);
    v.innerHTML=`<h2 class="title">Cupones emitidos</h2><p class="sub">Estado de las recompensas de tu negocio.</p>`;
    if(!mine.length){ v.innerHTML+=`<div class="empty"><span class="big">🎟️</span>Aún no emitiste cupones.</div>`; return; }
    v.innerHTML+=mine.map(c=>{
      const o=offer(c.offerId),cr=creators[c.creatorId],st=liveStatus(c);
      const badge=st==="activo"?`<span class="badge b-ok">● Activo</span>`:st==="redimido"?`<span class="badge b-mut">✓ Redimido</span>`:`<span class="badge b-warn">Vencido</span>`;
      return `<div class="card"><div class="oh">
        <div class="av">${cr.name[0]}</div>
        <div style="flex:1"><div class="biz-name">@${cr.handle}</div><div class="biz-cat">${o.title} · ${o.reward}</div></div>${badge}</div>
        <div class="tok" style="margin-top:2px">${c.token}${c.redeemedAt?` · usado ${new Date(c.redeemedAt).toLocaleDateString('es-CR')}`:""}</div></div>`;
    }).join("");
  }
}

/* ----- SCANNER ----- */
let html5qr=null, camOn=false;
function renderScanner(v){
  const active=coupons.filter(c=>liveStatus(c)==="activo");
  const others=coupons.filter(c=>liveStatus(c)!=="activo");
  v.innerHTML=`<h2 class="title">Validar cupón</h2><p class="sub">Escaneá el QR del creador para redimir la recompensa en tienda.</p>
    <div class="scanwrap">
      <div id="reader"></div>
      <div class="scanhint" id="scanhint"><span class="big">📷</span>Activá la cámara para escanear, o usá <b>“Simular escaneo”</b> abajo (ideal en este prototipo).</div>
      <button class="btn dark" id="camBtn" data-act="cam">Activar cámara</button>
      <div class="divider"></div>
      <div class="group-label" style="margin-top:0">Simular escaneo</div>
      <div class="simlist">
        ${active.map(c=>simRow(c)).join("")||`<div class="empty" style="padding:14px">No hay cupones activos ahora.</div>`}
        ${others.map(c=>simRow(c)).join("")}
      </div>
      <div class="divider"></div>
      <div class="group-label" style="margin-top:0">Ingresar código manual</div>
      <div class="manual"><input id="manIn" placeholder="QLABS-XXXXXX" autocapitalize="characters"/>
        <button class="btn primary" style="width:auto;padding:0 18px" data-act="manual">Validar</button></div>
    </div>`;
}
function simRow(c){
  const o=offer(c.offerId),cr=creators[c.creatorId],st=liveStatus(c);
  const tag=st==="activo"?`<span class="badge b-ok">activo</span>`:st==="redimido"?`<span class="badge b-mut">usado</span>`:`<span class="badge b-warn">vencido</span>`;
  return `<div class="simrow" data-act="sim" data-token="${c.token}">
    <div class="biz-emoji" style="width:34px;height:34px;font-size:17px">${o.emoji}</div>
    <div style="flex:1"><div class="nm">@${cr.handle} · ${o.biz}</div><div class="tk">${c.token}</div></div>${tag}</div>`;
}

/* ---------- QR ---------- */
function drawQR(el, text, size){
  if(!el) return; el.innerHTML="";
  var qr=qrcode(0,'M'); qr.addData(text); qr.make();
  el.innerHTML=qr.createSvgTag(4,1);
  var svg=el.querySelector('svg');
  if(svg){ svg.removeAttribute('width'); svg.removeAttribute('height');
    svg.setAttribute('width',size); svg.setAttribute('height',size); svg.style.display='block'; svg.style.borderRadius='4px';
    var path=svg.querySelector('path'); if(path) path.setAttribute('fill','#191a2e'); }
}

/* ---------- ACTIONS ---------- */
function applyTo(id){
  applications.push({id:"a"+Date.now(), offerId:id, creatorId:ME, status:"pendiente"});
  toast("Aplicaste a la oferta ✓"); render();
}
function emit(appId){
  const a=applications.find(x=>x.id===appId); if(!a) return;
  a.status="aceptada";
  const o=offer(a.offerId);
  coupons.push({id:"cp"+Date.now(), token:tok(), offerId:a.offerId, creatorId:a.creatorId, status:"activo",
    issuedAt:Date.now(), expiresAt:Date.now()+o.days*DAY + (o.days===0?7*DAY:0), redeemedAt:null});
  toast("🎟️ Cupón emitido a @"+creators[a.creatorId].handle); render();
}
function validate(token){
  const t=(token||"").trim().toUpperCase();
  const c=coupons.find(x=>x.token===t);
  if(!c) return showResult(false,"Cupón inválido","Este código no existe en el sistema.",null);
  const o=offer(c.offerId),cr=creators[c.creatorId];
  if(c.status==="redimido") return showResult(false,"Ya fue usado",`Redimido el ${new Date(c.redeemedAt).toLocaleDateString('es-CR')}.`,{o,cr});
  if(c.expiresAt<Date.now()){ c.status="vencido"; return showResult(false,"Cupón vencido","La ventana de canje ya cerró.",{o,cr}); }
  c.status="redimido"; c.redeemedAt=Date.now();
  showResult(true,"¡Válido!","Recompensa entregada. Cupón marcado como usado.",{o,cr});
}
function showResult(ok,title,msg,info){
  stopCam();
  const ov=$("#overlay");
  ov.className="overlay show "+(ok?"ok":"bad");
  ov.innerHTML=`<div class="mark">${ok?"✓":"✕"}</div><h3>${title}</h3>
    ${info?`<div class="rcard"><b>${info.o.reward}</b><p>${info.o.biz} · @${info.cr.handle}</p></div>`:`<p>${msg}</p>`}
    ${info?`<p style="margin-top:-6px">${msg}</p>`:""}
    <div style="height:14px"></div><button class="btn" data-act="closeov">Escanear otro</button>`;
}

/* ---------- CAMERA ---------- */
function startCam(){
  const hint=$("#scanhint"), btn=$("#camBtn");
  if(typeof Html5Qrcode==="undefined"){ if(hint)hint.innerHTML="La librería de cámara no cargó. Usá “Simular escaneo”."; return; }
  html5qr=new Html5Qrcode("reader");
  html5qr.start({facingMode:"environment"},{fps:10,qrbox:220},
    txt=>{ validate(txt); },
    ()=>{}
  ).then(()=>{ camOn=true; if(hint)hint.style.display="none"; if(btn){btn.textContent="Detener cámara"; btn.dataset.act="camstop";} })
   .catch(err=>{ if(hint)hint.innerHTML="No se pudo abrir la cámara en este entorno (permiso o navegador). Usá <b>“Simular escaneo”</b> — funciona igual para la demo."; });
}
function stopCam(){
  if(html5qr&&camOn){ try{html5qr.stop().then(()=>{try{html5qr.clear()}catch(e){}});}catch(e){} camOn=false; }
  const btn=$("#camBtn"); if(btn){btn.textContent="Activar cámara"; btn.dataset.act="cam";}
}

/* ---------- MODAL / TOAST ---------- */
function openModal(id){
  const c=coupons.find(x=>x.id===id); if(!c)return; const o=offer(c.offerId);
  $("#modalTitle").textContent=o.reward; $("#modalTok").textContent=c.token;
  drawQR($("#modalQr"),c.token,220); $("#modal").classList.add("show");
}
function closeModal(){$("#modal").classList.remove("show");}
let tT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2200);}

/* ---------- EVENTS ---------- */
document.addEventListener("click",e=>{
  const roleBtn=e.target.closest("#roleset button");
  if(roleBtn){ stopCam(); state.role=roleBtn.dataset.role; render(); return; }
  const tb=e.target.closest("[data-tab]");
  if(tb){ const k=tb.dataset.tab; stopCam();
    if(state.role==="creador") state.ctab=k;
    else state.ntab = (k==="bcupones"?"bcupones":"aplicantes");
    render(); return; }
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="apply") applyTo(el.dataset.id);
  else if(act==="emit") emit(el.dataset.app);
  else if(act==="zoom") openModal(el.dataset.id);
  else if(act==="sim") validate(el.dataset.token);
  else if(act==="manual"){ validate($("#manIn").value); }
  else if(act==="cam") startCam();
  else if(act==="camstop") stopCam();
  else if(act==="closeov"){ $("#overlay").classList.remove("show"); render(); }
});
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

render();
</script>
</body>
</html>
